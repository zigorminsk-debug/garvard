<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A51C30">
<title>Гарвард: Справедливость</title>
<style>
  :root{
    --crimson:#A51C30;
    --crimson-dark:#7d1424;
    --crimson-soft:#f7e9ec;
    --ink:#1b1a18;
    --ink-2:#4a4741;
    --muted:#8b857c;
    --bg:#f6f3ee;
    --card:#ffffff;
    --line:#e6e0d6;
    --gold:#b08d3f;
    --ok:#1f7a4d;
    --radius:18px;
    --shadow:0 2px 10px rgba(27,26,24,.07);
  }
  body.dark{
    --crimson:#e0566b;
    --crimson-dark:#ff8194;
    --crimson-soft:#2a1d22;
    --ink:#f2efe9;
    --ink-2:#c9c3b8;
    --muted:#948d82;
    --bg:#131211;
    --card:#1c1a18;
    --line:#2e2a26;
    --gold:#d8b46a;
    --shadow:0 2px 10px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--ink);
    line-height:1.62;font-size:16px;
    padding-bottom:78px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:600;line-height:1.28;}
  a{color:var(--crimson);text-decoration:none;}
  button{font-family:inherit;font-size:15px;cursor:pointer;}

  /* ---------- Шапка ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(160deg,var(--crimson) 0%,var(--crimson-dark) 100%);
    color:#fff;padding:16px 18px 18px;
    box-shadow:0 3px 16px rgba(0,0,0,.16);
  }
  header .brand{display:flex;align-items:center;gap:11px;}
  header .seal{
    width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    border:1.5px solid rgba(255,255,255,.65);
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;font-size:17px;font-weight:700;letter-spacing:.5px;
  }
  header h1{margin:0;font-size:16.5px;letter-spacing:.2px;}
  header .sub{font-size:11.5px;opacity:.82;letter-spacing:.3px;text-transform:uppercase;margin-top:2px;}
  header .back{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:7px 12px;font-size:14px;margin-right:2px;}

  /* ---------- Общие блоки ---------- */
  main{padding:18px 16px 26px;max-width:820px;margin:0 auto;}
  .hidden{display:none !important;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid var(--line);}
  .muted{color:var(--muted);font-size:13.5px;}
  .eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--crimson);font-weight:700;margin-bottom:6px;}
  .pill{display:inline-block;background:var(--crimson-soft);color:var(--crimson);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;margin:2px 4px 2px 0;}
  .quote{
    border-left:3px solid var(--gold);padding:2px 0 2px 14px;margin:16px 0;
    font-family:Georgia,serif;font-style:italic;color:var(--ink-2);font-size:16px;
  }
  .quote .src{display:block;font-style:normal;font-family:inherit;font-size:12.5px;color:var(--muted);margin-top:7px;}
  .hero-quote{font-family:Georgia,serif;font-size:17.5px;font-style:italic;line-height:1.55;color:var(--ink);}
  .divider{height:1px;background:var(--line);margin:18px 0;}

  /* ---------- Прогресс ---------- */
  .progress-row{display:flex;align-items:center;gap:16px;}
  .ring{--p:0;width:78px;height:78px;flex:0 0 auto;border-radius:50%;
    background:conic-gradient(var(--crimson) calc(var(--p)*1%), var(--line) 0);
    display:flex;align-items:center;justify-content:center;position:relative;}
  .ring::after{content:"";position:absolute;inset:7px;background:var(--card);border-radius:50%;}
  .ring span{position:relative;z-index:1;font-weight:700;font-size:16px;color:var(--crimson);}

  /* ---------- Список лекций ---------- */
  .lecture{
    display:flex;gap:14px;align-items:flex-start;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px;margin-bottom:11px;box-shadow:var(--shadow);
  }
  .lecture:active{transform:scale(.995);}
  .lecture .num{
    flex:0 0 auto;width:44px;height:44px;border-radius:13px;
    background:var(--crimson-soft);color:var(--crimson);
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;font-weight:700;font-size:18px;
  }
  .lecture .t{font-family:Georgia,serif;font-size:16px;font-weight:600;margin:0 0 3px;}
  .lecture .d{font-size:13.5px;color:var(--muted);margin:0;}
  .lecture .done{margin-left:auto;color:var(--ok);font-size:17px;align-self:center;}

  /* ---------- Статья ---------- */
  .article h2{font-size:19.5px;margin:26px 0 10px;color:var(--ink);}
  .article h3{font-size:16px;margin:20px 0 8px;}
  .article p{margin:0 0 13px;color:var(--ink-2);font-size:15.5px;text-align:left;}
  .article .lead{font-family:Georgia,serif;font-size:17px;color:var(--ink);line-height:1.6;}
  .article .key{
    background:var(--crimson-soft);border-radius:14px;padding:13px 15px;margin:14px 0;
    font-size:14.5px;color:var(--ink-2);border:1px solid var(--line);
  }
  .article .key b{color:var(--crimson);}
  .article ol,.article ul{padding-left:20px;color:var(--ink-2);font-size:15.5px;}
  .article li{margin-bottom:7px;}

  /* ---------- Квиз ---------- */
  .quiz-q{font-family:Georgia,serif;font-size:16px;margin:0 0 12px;}
  .opt{
    display:block;width:100%;text-align:left;
    background:var(--bg);border:1.5px solid var(--line);border-radius:13px;
    padding:12px 14px;margin-bottom:9px;color:var(--ink);font-size:15px;line-height:1.45;
    transition:.15s;
  }
  .opt.correct{background:rgba(31,122,77,.12);border-color:var(--ok);}
  .opt.wrong{background:rgba(165,28,48,.10);border-color:var(--crimson);}
  .explain{font-size:14px;color:var(--ink-2);background:var(--bg);border-radius:12px;padding:12px;margin-top:4px;}

  /* ---------- Кнопки ---------- */
  .btn{
    display:inline-block;border:0;border-radius:13px;padding:12px 18px;
    background:var(--crimson);color:#fff;font-weight:600;font-size:15px;
  }
  .btn:disabled{opacity:.45;}
  .btn.ghost{background:transparent;color:var(--crimson);border:1.5px solid var(--crimson);}
  .btn.wide{display:block;width:100%;text-align:center;margin-top:10px;}

  /* ---------- Навигация ---------- */
  nav{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:var(--card);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;align-items:stretch;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 14px rgba(0,0,0,.06);
  }
  nav button{
    background:none;border:0;flex:1;padding:6px 2px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;letter-spacing:.2px;
  }
  nav button .ico{font-size:19px;line-height:1.1;}
  nav button.active{color:var(--crimson);font-weight:700;}

  /* ---------- Словарь/философы ---------- */
  input.search{
    width:100%;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink);font-size:15px;margin-bottom:14px;
  }
  input.search:focus{outline:none;border-color:var(--crimson);}
  .term h4{margin:0 0 4px;font-size:16px;}
  .term .orig{font-size:12.5px;color:var(--muted);font-style:italic;margin-bottom:7px;}

  /* ---------- Дилеммы ---------- */
  .choice{
    border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card);
  }
  .choice.picked{border-color:var(--crimson);background:var(--crimson-soft);}
  .choice .school{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--crimson);font-weight:700;}

  .toast{
    position:fixed;left:50%;bottom:92px;transform:translateX(-50%);
    background:#26231f;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;
    z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:86%;text-align:center;
  }
  .toast.show{opacity:.97;}
  .stat{display:flex;gap:10px;text-align:center;}
  .stat > div{flex:1;background:var(--bg);border-radius:13px;padding:11px 6px;}
  .stat b{display:block;font-size:19px;color:var(--crimson);font-family:Georgia,serif;}
  .stat small{font-size:11.5px;color:var(--muted);}
  .row{display:flex;gap:10px;align-items:center;}
  .row > *{flex:1;}
  code{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:12.5px;word-break:break-all;}
</style>
</head>
<body>

<header id="header">
  <div class="brand">
    <button class="back hidden" id="backBtn">‹</button>
    <div class="seal">HJ</div>
    <div style="flex:1">
      <h1 id="hTitle">Гарвард: Справедливость</h1>
      <div class="sub" id="hSub">Курс лекций · 12 лекций</div>
    </div>
    <button class="back" id="themeBtn" onclick="toggleTheme()" title="Тема">◐</button>
  </div>
</header>

<main id="app"></main>

<nav id="nav">
  <button data-tab="home" class="active" onclick="go('home')"><span class="ico">❦</span>Курс</button>
  <button data-tab="dilemmas" onclick="go('dilemmas')"><span class="ico">⚖</span>Дилеммы</button>
  <button data-tab="philosophers" onclick="go('philosophers')"><span class="ico">☗</span>Мыслители</button>
  <button data-tab="glossary" onclick="go('glossary')"><span class="ico">✎</span>Словарь</button>
  <button data-tab="about" onclick="go('about')"><span class="ico">⚙</span>О курсе</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ==================== Данные ==================== */
var DATA = __COURSE_DATA__;

/* ==================== Состояние ==================== */
var STORE_KEY = 'garvard_justice_state_v1';
var state = load();
function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {read:[], quizzes:{}, dilemmas:{}, theme:null};
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ==================== Утилиты ==================== */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function md(s){
  // Мини-разметка: **жирный**, *курсив*, `код`, абзацы, списки
  var out = esc(s);
  out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  var blocks = out.split(/\n{2,}/);
  var html = blocks.map(function(b){
    b = b.trim();
    if(!b) return '';
    var lines = b.split('\n');
    var isList = lines.every(function(l){ return /^\s*[-•]\s+/.test(l); });
    var isNum  = lines.every(function(l){ return /^\s*\d+\.\s+/.test(l); });
    if(isList){
      return '<ul>' + lines.map(function(l){ return '<li>' + l.replace(/^\s*[-•]\s+/,'') + '</li>'; }).join('') + '</ul>';
    }
    if(isNum){
      return '<ol>' + lines.map(function(l){ return '<li>' + l.replace(/^\s*\d+\.\s+/,'') + '</li>'; }).join('') + '</ol>';
    }
    return '<p>' + lines.join('<br>') + '</p>';
  }).join('');
  return html;
}
function lectureById(id){
  for(var i=0;i<DATA.lectures.length;i++){ if(DATA.lectures[i].id===id) return DATA.lectures[i]; }
  return null;
}
function totalRead(){ return state.read.length; }
function quizScore(){
  var ok=0, total=0;
  DATA.lectures.forEach(function(l){
    total += l.quiz.length;
    var a = state.quizzes[l.id] || {};
    Object.keys(a).forEach(function(k){ if(a[k]===true) ok++; });
  });
  return {ok:ok, total:total};
}
function progress(){
  return Math.round(totalRead() / DATA.lectures.length * 100);
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ==================== Тема ==================== */
function applyTheme(){
  if(state.theme === 'dark') document.body.classList.add('dark');
  else document.body.classList.remove('dark');
}
function toggleTheme(){
  state.theme = (state.theme === 'dark') ? 'light' : 'dark';
  applyTheme(); save();
}

/* ==================== Роутинг ==================== */
var current = 'home';
function go(tab){
  current = tab;
  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.getElementById('backBtn').classList.add('hidden');
  document.getElementById('hTitle').textContent = 'Гарвард: Справедливость';
  document.getElementById('hSub').textContent = 'Курс лекций · 12 лекций';
  window.scrollTo(0,0);
  if(tab==='home') renderHome();
  else if(tab==='dilemmas') renderDilemmas();
  else if(tab==='philosophers') renderPhilosophers();
  else if(tab==='glossary') renderGlossary();
  else if(tab==='about') renderAbout();
}
var viewStack = [];
function pushView(fn){ viewStack.push(fn); }
function back(){ viewStack.pop(); var fn = viewStack[viewStack.length-1]; if(fn) fn(); else go(current); }

function openLecture(id){
  var lec = lectureById(id);
  if(!lec) return;
  document.getElementById('backBtn').classList.remove('hidden');
  document.getElementById('hSub').textContent = lec.module;
  document.getElementById('hTitle').textContent = 'Лекция ' + lec.id;
  window.scrollTo(0,0);
  renderLecture(lec);
}

/* ==================== Экран: Главная ==================== */
function renderHome(){
  var p = progress();
  var qs = quizScore();
  var html = '';
  html += '<div class="card">';
  html += '<div class="eyebrow">' + esc(DATA.university) + '</div>';
  html += '<div class="hero-quote">«Справедливость — это не только вопрос о том, как правильно распределять вещи; это также вопрос о том, как правильно их ценить».</div>';
  html += '<p class="muted" style="margin-top:10px">' + esc(DATA.courseSubtitle) + '</p>';
  html += '<div class="divider"></div>';
  html += '<div class="progress-row">';
  html += '<div class="ring" style="--p:' + p + '"><span>' + p + '%</span></div>';
  html += '<div style="flex:1"><b>' + totalRead() + ' из ' + DATA.lectures.length + '</b> лекций прочитано<br>';
  html += '<span class="muted">Тест: ' + qs.ok + ' из ' + qs.total + ' верных ответов</span></div>';
  html += '</div>';
  html += '<button class="btn wide" onclick="continueReading()">' + (totalRead()===0 ? 'Начать курс' : 'Продолжить чтение') + '</button>';
  html += '</div>';

  // Модули
  var modules = [];
  DATA.lectures.forEach(function(l){
    var m = modules.filter(function(x){ return x.name===l.module; })[0];
    if(!m){ m = {name:l.module, items:[]}; modules.push(m); }
    m.items.push(l);
  });
  modules.forEach(function(m){
    html += '<div class="eyebrow" style="margin:20px 4px 9px">' + esc(m.name) + '</div>';
    m.items.forEach(function(l){
      var done = state.read.indexOf(l.id) >= 0;
      html += '<div class="lecture" onclick="openLecture(' + l.id + ')">';
      html += '<div class="num">' + l.id + '</div>';
      html += '<div style="flex:1"><div class="t">' + esc(l.title) + '</div>';
      html += '<div class="d">' + esc(l.subtitle) + '</div>';
      html += '<div class="d" style="margin-top:5px;color:var(--crimson)">' + esc(l.philosophers.join(' · ')) + '</div></div>';
      if(done) html += '<div class="done">✓</div>';
      html += '</div>';
    });
  });
  html += '<p class="muted" style="text-align:center;margin:22px 6px 0;font-size:12.5px">Учебный курс по мотивам лекций профессора Майкла Сэндела.<br>Не является официальной публикацией Гарвардского университета.</p>';
  document.getElementById('app').innerHTML = html;
}

function continueReading(){
  for(var i=0;i<DATA.lectures.length;i++){
    if(state.read.indexOf(DATA.lectures[i].id) < 0) return openLecture(DATA.lectures[i].id);
  }
  toast('Все лекции прочитаны. Отличная работа!');
  openLecture(DATA.lectures[0].id);
}

/* ==================== Экран: Лекция ==================== */
function renderLecture(lec){
  var html = '<article class="article">';
  html += '<div class="eyebrow">' + esc(lec.module) + '</div>';
  html += '<h2 style="margin-top:2px;font-size:23px">' + esc(lec.title) + '</h2>';
  html += '<p class="muted" style="margin-top:-4px">' + esc(lec.subtitle) + '</p>';
  html += '<div>' + lec.philosophers.map(function(p){ return '<span class="pill">' + esc(p) + '</span>'; }).join('') + '</div>';
  html += '<div class="quote">' + esc(lec.epigraph.quote) + '<span class="src">' + esc(lec.epigraph.author) + '</span></div>';
  html += '<div class="card" style="margin-top:6px"><div class="eyebrow">Главный тезис</div><p style="margin:0;color:var(--ink)">' + esc(lec.summary) + '</p></div>';

  lec.sections.forEach(function(s, i){
    html += '<h2>' + (i+1) + '. ' + esc(s.heading) + '</h2>';
    html += md(s.body);
    if(s.keyQuote){
      html += '<div class="key"><b>💡 Ключевая мысль:</b> ' + md(s.keyQuote) + '</div>';
    }
  });

  var cs = lec.caseStudy;
  html += '<h2>Практикум: ' + esc(cs.title) + '</h2>';
  html += md(cs.scenario);
  html += '<h3>Аргументы стороны А</h3>' + md(cs.sideA);
  html += '<h3>Аргументы стороны Б</h3>' + md(cs.sideB);
  html += '<div class="key"><b>Вывод Сэндела:</b> ' + md(cs.conclusion) + '</div>';

  html += '<h2>Ключевые выводы</h2><ul>';
  lec.takeaways.forEach(function(t){ html += '<li>' + md(t) + '</li>'; });
  html += '</ul>';

  html += '<h2>Вопросы для размышления</h2><ol>';
  lec.reflectionQuestions.forEach(function(q){ html += '<li>' + md(q) + '</li>'; });
  html += '</ol>';

  html += '<h2>Проверь себя</h2>';
  lec.quiz.forEach(function(q, qi){
    html += '<div class="card" id="quiz-' + lec.id + '-' + qi + '">';
    html += '<p class="quiz-q">' + (qi+1) + '. ' + esc(q.question) + '</p>';
    q.options.forEach(function(opt, oi){
      html += '<button class="opt" onclick="answer(' + lec.id + ',' + qi + ',' + oi + ')">' + esc(opt) + '</button>';
    });
    html += '<div class="explain hidden" id="exp-' + lec.id + '-' + qi + '"></div>';
    html += '</div>';
  });

  html += '<button class="btn wide" id="doneBtn" onclick="markRead(' + lec.id + ')">Отметить лекцию прочитанной</button>';
  html += '</article>';

  var app = document.getElementById('app');
  app.innerHTML = html;

  // Восстанавливаем ответы на тест
  lec.quiz.forEach(function(q, qi){
    var saved = (state.quizzes[lec.id] || {})[qi];
    if(saved !== undefined){
      var buttons = app.querySelectorAll('#quiz-' + lec.id + '-' + qi + ' .opt');
      buttons.forEach(function(b, oi){
        if(oi === q.correctIndex) b.classList.add('correct');
        else if(oi === saved && saved !== q.correctIndex) b.classList.add('wrong');
        b.disabled = true;
      });
      var exp = document.getElementById('exp-' + lec.id + '-' + qi);
      exp.innerHTML = '<b>' + (saved === q.correctIndex ? '✅ Верно!' : '❌ Неверно.') + '</b> ' + esc(q.explanation);
      exp.classList.remove('hidden');
    }
  });

  if(state.read.indexOf(lec.id) >= 0){
    var b = document.getElementById('doneBtn');
    b.textContent = '✓ Лекция прочитана';
    b.classList.remove('btn'); b.classList.add('btn','ghost');
  }
}

function answer(lecId, qi, oi){
  var lec = lectureById(lecId);
  var q = lec.quiz[qi];
  if(!state.quizzes[lecId]) state.quizzes[lecId] = {};
  if(state.quizzes[lecId][qi] !== undefined) return;
  state.quizzes[lecId][qi] = oi;
  save();
  var app = document.getElementById('app');
  var buttons = app.querySelectorAll('#quiz-' + lecId + '-' + qi + ' .opt');
  buttons.forEach(function(b, i){
    if(i === q.correctIndex) b.classList.add('correct');
    else if(i === oi) b.classList.add('wrong');
    b.disabled = true;
  });
  var exp = document.getElementById('exp-' + lecId + '-' + qi);
  exp.innerHTML = '<b>' + (oi === q.correctIndex ? '✅ Верно!' : '❌ Неверно.') + '</b> ' + esc(q.explanation);
  exp.classList.remove('hidden');
}

function markRead(id){
  if(state.read.indexOf(id) < 0){ state.read.push(id); save(); }
  var b = document.getElementById('doneBtn');
  if(b){ b.textContent = '✓ Лекция прочитана'; }
  toast('Прогресс сохранён');
}

/* ==================== Экран: Дилеммы ==================== */
function renderDilemmas(){
  var html = '<p class="muted" style="margin-top:0">Выберите позицию — и увидите, какая философская школа стоит за каждым вариантом.</p>';
  DATA.dilemmas.forEach(function(d){
    var picked = state.dilemmas[d.id];
    html += '<div class="card">';
    html += '<div class="eyebrow">' + esc(d.category) + ' · Лекция ' + d.lectureId + '</div>';
    html += '<h3 style="margin:0 0 8px;font-size:17px">' + esc(d.title) + '</h3>';
    html += '<p style="font-size:14.5px;color:var(--ink-2)">' + esc(d.scenario) + '</p>';
    ['A','B'].forEach(function(k){
      var opt = (k==='A') ? d.optionA : d.optionB;
      var cls = picked === k ? 'choice picked' : 'choice';
      html += '<div class="' + cls + '" onclick="pickDilemma(\'' + d.id + '\',\'' + k + '\')">';
      html += '<div class="school">' + esc(opt.school) + '</div>';
      html += '<div style="font-weight:600;margin:3px 0 5px">' + (k==='A'?'А. ':'Б. ') + esc(opt.label) + '</div>';
      if(picked){
        html += '<div style="font-size:14px;color:var(--ink-2)">' + esc(opt.analysis) + '</div>';
      }
      html += '</div>';
    });
    if(picked){
      html += '<div class="explain"><b>Вопрос Сэндела:</b> ' + esc(d.sandelTwist) + '</div>';
    }
    html += '</div>';
  });
  document.getElementById('app').innerHTML = html;
}
function pickDilemma(id, k){
  state.dilemmas[id] = k; save(); renderDilemmas();
}

/* ==================== Экран: Мыслители ==================== */
function renderPhilosophers(){
  var html = '';
  DATA.philosophers.forEach(function(p){
    html += '<div class="card">';
    html += '<div class="eyebrow">' + esc(p.school) + '</div>';
    html += '<h3 style="margin:0 0 2px;font-size:18px">' + esc(p.name) + '</h3>';
    html += '<div class="muted" style="margin-bottom:9px">' + esc(p.englishName) + ' · ' + esc(p.years) + '</div>';
    html += '<p style="font-size:14.5px;color:var(--ink-2)"><b>Труд:</b> ' + esc(p.mainWork) + '</p>';
    html += '<div class="key"><b>Формула справедливости:</b> ' + esc(p.coreIdea) + '</div>';
    html += '<p style="font-size:14.5px;color:var(--ink-2)">' + esc(p.biography) + '</p>';
    html += '<p style="font-size:13.5px;color:var(--muted)"><b>Критика:</b> ' + esc(p.critique) + '</p>';
    html += '</div>';

}

/* ==================== Экран: Словарь ==================== */
function renderGlossary(filter){
  var q = (filter || '').toLowerCase();
  var html = '<input class="search" id="glossSearch" placeholder="Поиск термина…" value="' + esc(filter||'') + '" oninput="filterGlossary(this.value)">';
  var count = 0;
  DATA.glossary.forEach(function(g){
    var hay = (g.term + ' ' + g.origin + ' ' + g.definition).toLowerCase();
    if(q && hay.indexOf(q) < 0) return;
    count++;
    html += '<div class="card term">';
    html += '<h4>' + esc(g.term) + '</h4>';
    html += '<div class="orig">' + esc(g.origin) + '</div>';
    html += '<p style="margin:0;font-size:14.5px;color:var(--ink-2)">' + esc(g.definition) + '</p>';
    html += '</div>';
  });
  if(count === 0) html += '<p class="muted">Ничего не найдено.</p>';
  document.getElementById('app').innerHTML = html;
  var box = document.getElementById('glossSearch');
  if(box && filter){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
}
function filterGlossary(v){
  var q = v.toLowerCase();
  var app = document.getElementById('app');
  var cards = app.querySelectorAll('.term');
  var idx = 0;
  DATA.glossary.forEach(function(g){
    var hay = (g.term + ' ' + g.origin + ' ' + g.definition).toLowerCase();
    if(cards[idx]){
      cards[idx].style.display = (hay.indexOf(q) < 0) ? 'none' : '';
      idx++;
    }
  });
}

  var qs = quizScore();
  var html = '';
  html += '<div class="card">';
  html += '<div class="eyebrow">О курсе</div>';
  html += '<h3 style="margin:0 0 8px">По мотивам лекций Майкла Сэндела</h3>';
  html += '<p style="font-size:14.5px;color:var(--ink-2)">Этот курс — авторское учебное изложение двенадцати лекций легендарного гарвардского курса «Justice» (Moral Reasoning 22) профессора Майкла Дж. Сэндела. Материалы охватывают утилитаризм, либертарианство, категорическую этику Канта, теорию справедливости Ролза, аристотелевскую телеологию и политику общего блага.</p>';
  html += '<p style="font-size:13px;color:var(--muted)">Курс не является официальной публикацией Гарвардского университета и создан в образовательных целях.</p>';
  html += '</div>';

  html += '<div class="card"><div class="eyebrow">Ваш прогресс</div>';
  html += '<div class="stat">';
  html += '<div><b>' + totalRead() + '/' + DATA.lectures.length + '</b><small>лекций</small></div>';
  html += '<div><b>' + qs.ok + '/' + qs.total + '</b><small>тестов верно</small></div>';
  html += '<div><b>' + Object.keys(state.dilemmas).length + '/' + DATA.dilemmas.length + '</b><small>дилемм</small></div>';
  html += '</div>';
  html += '<button class="btn ghost wide" onclick="resetProgress()">Сбросить прогресс</button>';
  html += '</div>';

  html += '<div class="card"><div class="eyebrow">Обновление приложения</div>';
  html += '<div id="versionBox" class="muted">Версия загружается…</div>';
  html += '<button class="btn wide" id="updateBtn" onclick="checkUpdate()">Проверить обновления</button>';
  html += '<div id="updateResult" style="margin-top:10px;font-size:14px;color:var(--ink-2)"></div>';
  html += '</div>';

  html += '<div class="card"><div class="eyebrow">Подпись сборки</div>';
  html += '<p style="font-size:13.5px;color:var(--ink-2);margin:0">Все версии подписаны постоянным ключом проекта, поэтому новая версия устанавливается поверх старой с сохранением прогресса.</p>';
  html += '<p style="font-size:12.5px;color:var(--muted);margin-top:8px">SHA-256 сертификата:<br><code>' + esc((window.Android && Android.signature()) || '—') + '</code></p>';
  html += '</div>';

  html += '<p class="muted" style="text-align:center;font-size:12px;margin-top:18px">Исходный код и сборки: github.com/zigorminsk-debug/garvard</p>';
  document.getElementById('app').innerHTML = html;
  loadVersion();
}

function loadVersion(){
  var box = document.getElementById('versionBox');
  if(!box) return;
  if(window.Android && Android.versionInfo){
    try{
      var v = JSON.parse(Android.versionInfo());
      box.innerHTML = 'Установлена версия <b>' + esc(v.versionName) + '</b> (сборка ' + esc(v.versionCode) + ')';
      return;
    }catch(e){}
  }
  box.textContent = 'Веб-версия курса';
}

function checkUpdate(){
  var res = document.getElementById('updateResult');
  var btn = document.getElementById('updateBtn');
  if(!window.Android || !Android.checkUpdate){
    if(res) res.textContent = 'Проверка обновлений доступна в Android-приложении.';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Проверяем…';
  if(res) res.textContent = 'Запрашиваем GitHub Releases…';
  window.__onUpdateResult = function(json){
    btn.disabled = false;
    btn.textContent = 'Проверить обновления';
    var d;
    try{ d = JSON.parse(json); }catch(e){ if(res) res.textContent = 'Ошибка ответа сервера.'; return; }
    if(!res) return;
    if(d.error){ res.textContent = 'Не удалось проверить обновления: ' + d.error; return; }
    if(d.available){
      res.innerHTML = '<b style="color:var(--crimson)">Доступна версия ' + esc(d.latestVersionName) + '</b><br>' +
        '<span class="muted">' + esc(d.publishedAt || '') + '</span>' +
        (d.notes ? '<div class="explain" style="margin-top:8px">' + esc(d.notes).slice(0,600) + '</div>' : '') +
        '<button class="btn wide" onclick="installUpdate()">Скачать и установить</button>';
      window.__latestApk = d.apkUrl;
      window.__latestName = d.apkName || 'garvard-update.apk';
    }else{
      res.textContent = 'У вас последняя версия приложения (' + esc(d.currentVersionName || '') + ').';
    }
  };
  Android.checkUpdate();
}

function installUpdate(){
  if(!window.__latestApk){ toast('Ссылка на обновление не найдена'); return; }
  if(!window.Android || !Android.downloadAndInstall){
    toast('Скачивание доступно только в приложении');
    return;
  }
  toast('Скачиваем обновление…');
  Android.downloadAndInstall(window.__latestApk, window.__latestName);
}

function resetProgress(){
  state = {read:[], quizzes:{}, dilemmas:{}, theme:state.theme};
  save(); toast('Прогресс сброшен'); renderAbout();
}

/* ==================== Старт ==================== */
document.getElementById('backBtn').addEventListener('click', function(){
  if(viewStack.length > 1){ back(); } else { go('home'); }
});
applyTheme();
go('home');
</script>
